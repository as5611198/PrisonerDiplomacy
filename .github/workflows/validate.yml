name: Validate Prisoner Diplomacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  localization:
    name: Validate localization
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate five language files
        shell: pwsh
        run: ./Tools/ValidateLocalization.ps1

  telemetry:
    name: Check telemetry worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/PrisonerDiplomacyTelemetry
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/PrisonerDiplomacyTelemetry/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run worker checks
        run: npm run check
